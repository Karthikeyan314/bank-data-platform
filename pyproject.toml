[project]
name = "bank-data-platform"
version = "0.1.0"
description = "End-to-end analytics engineering pipeline on real retail-banking data: ingestion, dbt star schema, quality gates, refresh-over-refresh QC, Airflow and Dagster orchestration."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dbt-core>=1.11",
    "dbt-duckdb>=1.10",
    "duckdb>=1.3,<2",
    "httpx>=0.27",
    "pyyaml>=6",
]

[project.optional-dependencies]
dagster = [
    "dagster>=1.11",
    "dagster-dbt>=0.27",
    "dagster-webserver>=1.11",
]

chatbot = [
    "huggingface_hub>=0.30",
    "streamlit>=1.40",
]

[dependency-groups]
dev = [
    "pre-commit>=4",
    "pytest>=8",
    "ruff>=0.12",
    "sqlfluff>=3.4,<3.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: builds the warehouse end to end (slow, downloads data)"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]
